name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The repository does not commit generated Flutter platform scaffolding.
      # Generate Android files in CI so the real release APK can still be built.
      - run: flutter create --platforms=android --project-name inventory_shop .
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
