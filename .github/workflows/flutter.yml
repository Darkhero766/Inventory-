name: Flutter CI & Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore last known-good UI source
        if: hashFiles('.ci/recover-ui') != ''
        run: |
          git checkout 34e98f3ab9674afc439110d7ca08a45c154e4cdd -- lib/main.dart
          rm -f .ci/recover-ui
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .ci/recover-ui
          git commit -m "fix: restore stable inventory UI source"
          git push

      - run: flutter analyze
      - run: flutter test

      - run: flutter create --platforms=android --project-name inventory_shop .
      - run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: inventory-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Inventory Android ${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
