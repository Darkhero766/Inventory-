name: Flutter CI & Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Repair the compact UI rewrite before validation. This is intentionally
      # source-level and commits the repaired file back to main so the fix is
      # permanent rather than merely masking CI errors.
      - name: Repair UI source syntax
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text()

          old_state = """class _AppShellState extends State<AppShell> {\n  int index = 0;\n\n  static const labels = ['Home', 'Inventory', 'Purchases', 'Sales', 'More'];\n  static const icons = [\n    Icons.space_dashboard_outlined,\n    Icons.inventory_2_outlined,\n    Icons.shopping_bag_outlined,\n    Icons.point_of_sale_outlined,\n    Icons.more_horiz,\n  ];\n"""
          new_state = """class _AppShellState extends State<AppShell> {\n  int index = 0;\n"""
          old_app = """class AppShell extends StatefulWidget {\n  final bool loadDatabase;\n\n  const AppShell({super.key, this.loadDatabase = false});\n"""
          new_app = """class AppShell extends StatefulWidget {\n  final bool loadDatabase;\n\n  static const labels = ['Home', 'Inventory', 'Purchases', 'Sales', 'More'];\n  static const icons = [\n    Icons.space_dashboard_outlined,\n    Icons.inventory_2_outlined,\n    Icons.shopping_bag_outlined,\n    Icons.point_of_sale_outlined,\n    Icons.more_horiz,\n  ];\n\n  const AppShell({super.key, this.loadDatabase = false});\n"""
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          if old_app in text and "static const labels" not in text.split("class AppShell", 1)[1].split("class _AppShellState", 1)[0]:
              text = text.replace(old_app, new_app, 1)

          lines = text.splitlines()

          def replace_line_start(start, replacement):
              for i, line in enumerate(lines):
                  if line.startswith(start):
                      lines[i:i+1] = replacement.strip('\n').splitlines()
                      return True
              return False

          form = r'''    final saved = await showDialog<bool>(
      context: context,
      builder: (_) => AlertDialog(
        title: const Text('Add product'),
        content: SizedBox(
          width: 520,
          child: Form(
            key: formKey,
            child: SingleChildScrollView(
              child: Column(
                children: [
                  field(name, 'Product name'),
                  field(brand, 'Brand'),
                  field(category, 'Category'),
                  field(model, 'Model'),
                  field(sku, 'SKU'),
                  Row(
                    children: [
                      Expanded(child: field(purchase, 'Purchase price', number: true)),
                      const SizedBox(width: 10),
                      Expanded(child: field(selling, 'Selling price', number: true)),
                    ],
                  ),
                  Row(
                    children: [
                      Expanded(child: field(mrp, 'MRP', number: true)),
                      const SizedBox(width: 10),
                      Expanded(child: field(quantity, 'Quantity', number: true)),
                    ],
                  ),
                  field(minimum, 'Minimum stock', number: true),
                ],
              ),
            ),
          ),
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(context, false),
            child: const Text('Cancel'),
          ),
          FilledButton(
            onPressed: () {
              if (formKey.currentState!.validate()) {
                Navigator.pop(context, true);
              }
            },
            child: const Text('Save'),
          ),
        ],
      ),
    );'''
          details = r'''  await showModalBottomSheet<void>(
    context: context,
    isScrollControlled: true,
    backgroundColor: Colors.white,
    shape: const RoundedRectangleBorder(
      borderRadius: BorderRadius.vertical(top: Radius.circular(28)),
    ),
    builder: (_) => SafeArea(
      child: Padding(
        padding: const EdgeInsets.fromLTRB(22, 16, 22, 22),
        child: Wrap(
          children: [
            Center(
              child: Container(
                width: 42,
                height: 4,
                decoration: BoxDecoration(
                  color: Colors.black12,
                  borderRadius: BorderRadius.circular(4),
                ),
              ),
            ),
            const SizedBox(height: 16),
            Row(
              children: [
                _ProductThumb(product: p, size: 72),
                const SizedBox(width: 14),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(p.name, style: const TextStyle(fontSize: 19, fontWeight: FontWeight.w900)),
                      Text('${p.brand} · ${p.sku}', style: const TextStyle(color: _muted, fontSize: 12)),
                      const SizedBox(height: 7),
                      StatusBadge(p.status),
                    ],
                  ),
                ),
              ],
            ),
            const SizedBox(height: 18),
            _DetailLine('Selling price', money(p.sellingPrice)),
            _DetailLine('Purchase price', money(p.purchasePrice)),
            _DetailLine('Stock', '${p.quantity} units'),
            _DetailLine('Margin', '${p.margin.toStringAsFixed(1)}%'),
            const SizedBox(height: 14),
            Row(
              children: [
                Expanded(
                  child: OutlinedButton.icon(
                    onPressed: () async {
                      Navigator.pop(context);
                      await AppDatabase.instance.adjustStock(p.id, 1, 'ADJUSTMENT', 'Manual stock addition');
                      await refresh();
                    },
                    icon: const Icon(Icons.add),
                    label: const Text('Add stock'),
                  ),
                ),
                const SizedBox(width: 10),
                Expanded(
                  child: FilledButton.icon(
                    onPressed: () async {
                      Navigator.pop(context);
                      await AppDatabase.instance.adjustStock(p.id, -1, 'ADJUSTMENT', 'Manual stock removal');
                      await refresh();
                    },
                    icon: const Icon(Icons.remove),
                    label: const Text('Remove stock'),
                  ),
                ),
              ],
            ),
          ],
        ),
      ),
    ),
  );'''
          more = r'''  @override
  Widget build(BuildContext context) {
    return Frame(
      child: ListView(
        children: [
          const PageHeader(title: 'More', subtitle: 'Business tools and settings'),
          const SizedBox(height: 20),
          LayoutBuilder(
            builder: (_, c) {
              final columns = c.maxWidth > 900 ? 3 : 1;
              final tiles = [
                _FeatureCard(icon: Icons.people_outline, title: 'Customers', subtitle: 'Customer profiles, invoices and balances.'),
                _FeatureCard(icon: Icons.local_shipping_outlined, title: 'Suppliers', subtitle: 'Supplier contacts, purchase history and payments.'),
                _FeatureCard(icon: Icons.receipt_long_outlined, title: 'Expenses', subtitle: 'Track operating expenses and payment methods.'),
                _FeatureCard(icon: Icons.bar_chart_outlined, title: 'Reports', subtitle: 'Sales, profit, stock and movement analytics.'),
                _FeatureCard(icon: Icons.backup_outlined, title: 'Backup & restore', subtitle: 'Protect and restore your local shop database.'),
                _FeatureCard(icon: Icons.settings_outlined, title: 'Settings', subtitle: 'Shop profile, GST, inventory and users.'),
              ];
              return GridView.count(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                crossAxisCount: columns,
                crossAxisSpacing: 14,
                mainAxisSpacing: 14,
                childAspectRatio: columns == 1 ? 3.3 : 1.55,
                children: tiles,
              );
            },
          ),
        ],
      ),
    );
  }'''

          assert replace_line_start('    final saved = await showDialog<bool>(', form), 'product form line not found'
          assert replace_line_start('  await showModalBottomSheet<void>(', details), 'product details line not found'

          # Replace the MorePage build method by locating the class and its build line.
          more_start = next(i for i, line in enumerate(lines) if line.startswith('class MorePage extends StatelessWidget'))
          build_idx = next(i for i in range(more_start, len(lines)) if lines[i].strip() == 'Widget build(BuildContext context) => Frame(child: ListView(children: [const PageHeader(title: \'More\''))
          end_idx = build_idx + 1
          lines[build_idx:end_idx] = more.strip('\n').splitlines()

          path.write_text('\n'.join(lines) + '\n')
      
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo "No source repair needed"
          else
            git commit -m "fix: repair redesigned inventory UI source"
            git push
          fi

      - run: flutter analyze
      - run: flutter test

      # The repository does not commit generated Flutter platform scaffolding.
      # Generate Android files in CI so the release APK can still be built.
      - run: flutter create --platforms=android --project-name inventory_shop .

      # Current Flutter Android dependencies require API 36 for AAR metadata checks.
      - run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: inventory-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Every successful push to main gets a downloadable GitHub Release.
      # The run number makes each release unique even when pubspec version is unchanged.
      - name: Publish Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Inventory Android ${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
